org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Defaults target the newest supported Minecraft version; versions/<mc>.properties override them
# for the others (see README). Fabric: https://fabricmc.net/develop
minecraft_version=1.21.11
# What fabric.mod.json requires at runtime: exactly the version the jar was built against.
minecraft_dep=1.21.11
# What fabric.mod.json requires of the Java runtime (26.x needs 25).
java_dep=>=21
yarn_mappings=1.21.11+build.6
loader_version=0.20.1
fabric_api_version=0.141.6+1.21.11
fabric_kotlin_version=1.14.2+kotlin.2.4.21

# Which folders under src/compat hold the Minecraft-version-specific code. A version picks one per axis:
#   MCEF library:  modern (MCEF Modern, 1.21.10+)   | legacy (CinemaMod's MCEF, 1.21.4 and older)
#   naming scheme: yarn   (1.21.11 and older)       | mojmap (Mojang names, 26.x)
#   both together: modern-yarn, legacy-yarn, modern-mojmap (browser screen, key handling)
compat_dirs=modern,yarn,modern-yarn,gametest-world

# The embedded-Chromium library. mcef_id is both its Modrinth slug and its Fabric mod id.
mcef_coordinate=net.dimaskama:mcef-modern
mcef_id=mcef-modern
mcef_version=0.3.3+mc1.21.11.jcef146.0.10
# Only needed at compile time: MCEF Modern declares it with runtime scope.
jcef_api_version=jcef-d3de827+cef-146.0.10+g8219561+chromium-146.0.7680.179

# Mod
mod_version=0.1.3
maven_group=relict
archives_base_name=relict
